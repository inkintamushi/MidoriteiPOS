spring.application.name=demo

# demo/.env があれば読み込む（KEY=VALUE 形式、git管理外）。実行時の作業ディレクトリ
# （mvnw spring-boot:run 実行時は demo/）からの相対パスで解決される。
spring.config.import=optional:file:.env[.properties]

# Apache 経由アクセス対応（Spring Boot 3+ / 4）
server.forward-headers-strategy=native
spring.datasource.url=${MYSQL_URL:jdbc:mysql://localhost:3306/midoritei?useUnicode=true&characterEncoding=UTF-8&serverTimezone=Asia/Tokyo&allowPublicKeyRetrieval=true&useSSL=false&createDatabaseIfNotExist=true}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:}

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

# ローカルでH2を使いたい場合は、上の datasource をH2向けに戻してください。
