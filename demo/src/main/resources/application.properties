spring.application.name=demo

# デフォルトはアプリ単体で動かせる内蔵H2 DB。
# MySQLを使う場合は --spring.profiles.active=mysql を付けて起動してください。
server.forward-headers-strategy=native
spring.datasource.url=${APP_DB_URL:jdbc:h2:file:./data/midoritei-standalone;MODE=MySQL;DATABASE_TO_UPPER=false;DB_CLOSE_DELAY=-1}
spring.datasource.driver-class-name=${APP_DB_DRIVER:org.h2.Driver}
spring.datasource.username=${APP_DB_USER:sa}
spring.datasource.password=${APP_DB_PASSWORD:}

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
