<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ログイン画面</title>
  <style>
    body {
      margin: 0;
      background: #f0f0f0;
      font-family: sans-serif;
    }

    /* スマホ枠 */
    .phone {
      width: 360px;
      height: 740px;
      margin: 40px auto;
      background: #fff;
      border-radius: 40px;
      border: 4px solid #000;
      position: relative;
      overflow: hidden;
    }

    /* ヘッダー */
    .header {
      background: #0b3d0b;
      color: #fff;
      text-align: center;
      font-size: 28px;
      padding: 24px 0;
      border-bottom-left-radius: 30px;
      border-bottom-right-radius: 30px;
    }

    /* フォーム */
    .content {
      padding: 40px 24px;
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      height: 40px;
      margin-bottom: 24px;
      border: 2px solid #000;
      font-size: 16px;
      padding: 4px 8px;
    }

    .login-btn {
      display: block;
      margin: 40px auto 0;
      padding: 10px 32px;
      background: #0b3d0b;
      color: #fff;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    /* 下部ホームボタン */
    .home {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      width: 56px;
      height: 56px;
      border: 3px solid #fff;
      border-radius: 50%;
      background: #000;
    }

    /* ===== エラーダイアログ ===== */
    .modal {
      display: none; /* エラー時に block */
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.2);
    }

    .modal-box {
      width: 280px;
      background: #fff;
      border: 3px solid #000;
      border-radius: 30px;
      margin: 160px auto;
      padding: 24px 16px;
      text-align: center;
    }

    .modal-title {
      border: 2px solid #000;
      padding: 6px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .modal-text {
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .ok-btn {
      background: #0b3d0b;
      color: #fff;
      border: none;
      padding: 8px 32px;
      border-radius: 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>

<div class="phone">
  <div class="header">みどり亭</div>

  <div class="content">
    <label>店員ID</label>
    <input type="text">

    <label>パスワード</label>
    <input type="password">

    <button class="login-btn" onclick="showError()">ログイン</button>
  </div>

  <div class="home"></div>

  <!-- エラーモーダル -->
  <div class="modal" id="errorModal">
    <div class="modal-box">
      <div class="modal-title">ログインエラー</div>
      <div class="modal-text">
        ログインに失敗しました。<br>
        店員ID、パスワード<br>
        が違います。
      </div>
      <button class="ok-btn" onclick="hideError()">ok</button>
    </div>
  </div>
</div>

<script>
  function showError() {
    document.getElementById('errorModal').style.display = 'block';
  }
  function hideError() {
    document.getElementById('errorModal').style.display = 'none';
  }
</script>

</body>
</html>
