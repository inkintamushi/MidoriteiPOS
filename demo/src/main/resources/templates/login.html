<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ログイン画面</title>
  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: #dcdcdc;
      font-family: sans-serif;
    }

    /* スマホ本体 → 実機画面いっぱいに表示 */
    .phone {
      width: 100%;
      min-height: 100vh;
      margin: 0;
      background: #fff;
      border-radius: 0;
      border: 0;
      position: relative;
      display: flex;
      flex-direction: column;
      overflow: visible;
    }

    /* ヘッダー */
    .header {
      background: #003d00;
      color: #fff;
      text-align: center;
      font-size: clamp(24px, 7vw, 36px);
      padding: clamp(18px, 5vw, 34px) 12px;
      border-radius: 0;
    }

    /* フォーム */
    .content {
      flex: 1;
      padding: clamp(20px, 6vw, 40px) clamp(16px, 6vw, 24px);
    }

    label {
      display: block;
      margin-bottom: 8px;
      font-size: 14px;
    }

    input {
      width: 100%;
      height: 40px;
      margin-bottom: 24px;
      border: 2px solid #000;
      font-size: 16px;
      padding: 4px 8px;
      box-sizing: border-box;
    }

    .login-btn {
      display: block;
      margin: 40px auto 0;
      padding: 10px 32px;
      background: #003d00;
      color: #fff;
      font-size: 16px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }

    /* 下の黒いエリア・ホームボタン（実機では不要な演出のため非表示） */
    .bottom,
    .home {
      display: none;
    }

    /* エラーダイアログ */
    .modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0,0,0,0.2);
      z-index: 20;
    }

    .modal-box {
      width: min(280px, 85vw);
      background: #fff;
      border: 3px solid #000;
      border-radius: 30px;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      padding: 24px 16px;
      text-align: center;
    }

    .modal-title {
      border: 2px solid #000;
      padding: 6px;
      margin-bottom: 20px;
      font-weight: bold;
    }

    .modal-text {
      font-size: 14px;
      margin-bottom: 24px;
      line-height: 1.6;
    }

    .ok-btn {
      background: #003d00;
      color: #fff;
      border: none;
      padding: 8px 32px;
      border-radius: 10px;
      font-size: 14px;
      cursor: pointer;
    }
  
</style>
</head>
<body>
  
<div class="demo-info">
  <p>🔑 デモ用ログイン情報</p>
  <p>ID：<span>staff</span>　パスワード：<span>1234</span></p>
</div>

<div class="phone">
  <div class="header">みどり亭</div>

  <div class="content">
    <label>店員ID</label>
    <input type="text">

    <label>パスワード</label>
    <input type="password">

    <button class="login-btn" onclick="tryLogin()">ログイン</button>
  </div>

  <div class="bottom"></div>
  <div class="home"></div>

  <!-- エラーモーダル -->
  <div class="modal" id="errorModal">
    <div class="modal-box">
      <div class="modal-title">ログインエラー</div>
      <div class="modal-text">
        ログインに失敗しました。<br>
        店員ID、パスワード<br>
        が違います。
      </div>
      <button class="ok-btn" onclick="hideError()">ok</button>
    </div>
  </div>
</div>

<script>
  async function tryLogin() {
    const id = document.querySelectorAll('input')[0].value;
    const pw = document.querySelectorAll('input')[1].value;

    const response = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ staffId: id, password: pw })
    });
    const result = await response.json();

    if (result.ok) {
      window.location.href = 'taku.html';
    } else {
      document.getElementById('errorModal').style.display = 'block';
    }
  }
  function showError() {
    document.getElementById('errorModal').style.display = 'block';
  }
  function hideError() {
    document.getElementById('errorModal').style.display = 'none';
  }
</script>

</body>
</html>
