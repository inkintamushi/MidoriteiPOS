<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>みどり亭</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>

<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #dcdcdc;
  font-family: sans-serif;
}

/* ===== スマホ本体 → 実機画面いっぱいに表示 ===== */
.phone {
  width: 100%;
  min-height: 100vh;
  margin: 0;
  background: #fff;
  border-radius: 0;
  border: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: visible;
}

/* ===== ヘッダー（default_nav.html 共通） ===== */
.header {
  background: #003d00;
  color: #fff;
  text-align: center;
  font-size: clamp(24px, 7vw, 36px);
  padding: clamp(18px, 5vw, 34px) 12px;
  border-radius: 0;
}

/* ===== タブ（default_nav.html 共通） ===== */
.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 2px solid #999;
  border-bottom: 2px solid #999;
}

.tab {
  text-align: center;
  padding: 14px 0;
  background: #eee;
  border-right: 1px solid #999;
  font-size: 14px;
  cursor: pointer;
}

.tab:last-child {
  border-right: none;
}

.tab.active-tab {
  background: #003d00;
  color: #fff;
  font-weight: bold;
}

/* ===== コンテンツエリア ===== */
.content-area {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: auto;
  padding: 10px;
}

/* ===== 画面切替 ===== */
.screen { display: none; flex-direction: column; min-height: 0; flex: 1; }
.screen.active { display: flex; }

/* ===== テーブル ===== */
table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 13px;
}

th, td {
  border: 1px solid #ccc;
  padding: 5px 3px;
  text-align: center;
}

th {
  background: #eee;
}

/* ===== ボタン ===== */
.btn {
  min-width: 52px;
  padding: 5px 6px;
  border: none;
  border-radius: 5px;
  color: white;
  cursor: pointer;
  font-size: 12px;
}

.green  { background: #1b5e20; }
.orange { background: #ef6c00; }
.light  { background: #8bc34a; }
.gray   { background: #777; }

.qr-btn {
  padding: 5px 8px;
  font-size: 12px;
}

.qr-modal {
  display: none;
  position: absolute;
  inset: 0;
  z-index: 20;
  background: rgba(255, 255, 255, .35);
  align-items: center;
  justify-content: center;
}

.qr-modal.active {
  display: flex;
}

.qr-modal-card {
  width: min(300px, 88vw);
  background: #fff;
  border: 3px solid #000;
  border-radius: 28px;
  padding: 18px 16px;
  text-align: center;
}

.qr-modal-title {
  border: 2px solid #000;
  padding: 8px;
  margin-bottom: 14px;
  font-weight: bold;
}

.qr-modal-text {
  min-height: 38px;
  margin-bottom: 10px;
  color: #333;
  font-size: 13px;
  line-height: 1.4;
  word-break: break-all;
}

.qr-code-box {
  width: 180px;
  height: 180px;
  margin: 0 auto 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px solid #999;
  background: #fff;
}

.qr-code-box canvas,
.qr-code-box img {
  width: 160px;
  height: 160px;
}

.qr-modal-buttons {
  display: flex;
  justify-content: center;
  gap: 14px;
}

/* ===== 下の黒いエリア・ホームボタン（実機では不要な演出のため非表示） ===== */
.bottom,
.home {
  display: none;
}

</style>

<link rel="stylesheet" href="/css/employee-auth.css">
<script src="/js/employee-auth.js"></script>
</head>
<body>

<div class="phone">

  <!-- ===== 共通ヘッダー ===== -->
  <div class="header">みどり亭</div>

  <!-- ===== 共通タブ ===== -->
  <div class="tabs">
    <div class="tab active-tab">ホーム</div>
    <div class="tab" onclick="location.href='mihaizen_rireki.html'">配膳登録</div>
    <div class="tab" onclick="location.href='kyakuannnai.html'">案内</div>
    <div class="tab" onclick="location.href='shouhinnkannri.html'">商品管理</div>
  </div>

  <!-- ============================================================
       画面1: 卓選択
  ============================================================ -->
  <div id="screen-table" class="screen active">
    <div class="content-area">
      <table>
        <thead>
          <tr>
            <th>卓番号</th>
            <th>座席状況</th>
            <th>注文</th>
            <th>注文履歴</th>
            <th>QR</th>
          </tr>
        </thead>
        <tbody id="table-list"></tbody>
      </table>
    </div>
  </div>

  <!-- ============================================================
       画面2: 未配膳
  ============================================================ -->
  <div id="screen-wait" class="screen">
    <div class="content-area">未配膳画面</div>
  </div>

  <!-- ============================================================
       画面3: 案内
  ============================================================ -->
  <div id="screen-guide" class="screen">
    <div class="content-area">案内画面</div>
  </div>

  <!-- ============================================================
       画面4: 商品管理
  ============================================================ -->
  <div id="screen-menu" class="screen">
    <div class="content-area">商品管理</div>
  </div>

  <!-- ===== 共通フッター ===== -->
  <div class="bottom"></div>
  <div class="home"></div>

  <div id="qr-modal" class="qr-modal">
    <div class="qr-modal-card">
      <div class="qr-modal-title">QR再発行</div>
      <div id="qr-modal-text" class="qr-modal-text"></div>
      <div id="qr-code-box" class="qr-code-box"></div>
      <div class="qr-modal-buttons">
        <button class="btn green" type="button" onclick="closeQrModal()">閉じる</button>
      </div>
    </div>
  </div>

</div>

<script>
/* ========================================
   タブ切替（tyuumonn.html 方式）
======================================== */
function switchTab(e, screenId) {
  // 全画面を非表示
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  // 対象画面を表示
  document.getElementById(screenId).classList.add('active');

  // タブのアクティブ状態を更新
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  e.currentTarget.classList.add('active');
}

/* ========================================
   卓ボタン動作
======================================== */
function callTable(n) { location.href = 'taioujoukyou.html?table=' + n; }
function orderTable(n) {
  localStorage.setItem('currentOrderTable', n);
  location.href = 'tyuumonn.html?table=' + n;
}
function historyTable(n) { location.href = 'rireki.html?table=' + n; }

function buildOrderQrUrl(tableNo) {
  const url = new URL('/order', location.origin);
  url.searchParams.set('table', tableNo);
  return url.href;
}

function reissueQr(tableNo) {
  const qrUrl = buildOrderQrUrl(tableNo);
  const qrBox = document.getElementById('qr-code-box');
  const text = document.getElementById('qr-modal-text');

  localStorage.setItem('currentOrderTable', tableNo);
  text.textContent = `卓番号：${tableNo} / ${qrUrl}`;
  qrBox.innerHTML = '';

  if (window.QRCode) {
    new QRCode(qrBox, {
      text: qrUrl,
      width: 160,
      height: 160,
      correctLevel: QRCode.CorrectLevel.M
    });
  } else {
    qrBox.textContent = qrUrl;
  }

  document.getElementById('qr-modal').classList.add('active');
}

function closeQrModal() {
  document.getElementById('qr-modal').classList.remove('active');
}
</script>
<script src="/js/table-management-db.js"></script>

</body>
</html>
