<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>履歴画面</title>

<link rel="stylesheet" href="/css/common.css">

<style>
.history-table {
  width: 100%;
  border-collapse: collapse;
  table-layout: fixed;
  font-size: 18px;
  color: #333;
}

.history-table th,
.history-table td {
  height: 30px;
  padding: 0 6px;
  border: 1px solid #d9d9d9;
  box-sizing: border-box;
}

.history-table th {
  font-weight: normal;
  text-align: left;
  background: #fff;
}

.history-table td:nth-child(2),
.history-table td:nth-child(3) {
  text-align: right;
}

.history-name {
  width: 48%;
}

.history-qty {
  width: 22%;
}

.history-price {
  width: 30%;
}

.history-empty {
  padding-top: 70px;
  text-align: center;
  color: #555;
  font-size: 18px;
}

.order-nav {
  position: absolute;
  bottom: 120px;
  left: 0;
  width: 100%;
  height: 46px;
  background: #90c978;
  color: #fff;
  border: none;
  font-size: 20px;
  cursor: pointer;
}

/* Responsive Web layout: remove smartphone mock frame */
body {
  background: #fff;
  min-height: 100vh;
  min-height: 100dvh;
}

.history-total {
  padding: 12px 10px;
  color: #003d00;
  text-align: right;
  font-size: 20px;
  font-weight: bold;
  border-bottom: 1px solid #d8d8d8;
}

.phone {
  width: 100%;
  max-width: none;
  min-height: 100vh;
  min-height: 100dvh;
  height: auto;
  margin: 0;
  border: 0;
  border-radius: 0;
  overflow: visible;
  padding-bottom: calc(108px + env(safe-area-inset-bottom));
}

.header {
  border-radius: 0;
  padding: clamp(18px, 5vw, 34px) 12px;
  font-size: clamp(24px, 7vw, 36px);
}

.bottom,
.home {
  display: none;
}

.content,
.content-area {
  height: auto;
  min-height: calc(100vh - 140px);
  padding-bottom: 24px;
  overflow: visible;
  padding-bottom: calc(108px + env(safe-area-inset-bottom));
}

@media (max-width: 640px) {
  .tabs,
  .category-bar,
  .menu-bar {
    overflow-x: auto;
  }
}

.order-nav {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 6;
  width: 100%;
  padding-bottom: env(safe-area-inset-bottom);
}

.history-total {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(46px + env(safe-area-inset-bottom));
  z-index: 6;
  background: #fff;
  box-sizing: border-box;
}

.history-table {
  margin-bottom: calc(112px + env(safe-area-inset-bottom));
}
</style>
</head>

<body>

<div class="phone">

<div class="header">みどり亭</div>

<table class="history-table">
  <thead>
    <tr>
      <th class="history-name">商品名</th>
      <th class="history-qty">数量</th>
      <th class="history-price">値段</th>
    </tr>
  </thead>
  <tbody id="history-body"></tbody>
</table>

<div id="history-empty" class="history-empty">注文履歴はありません。</div>

<div id="history-total" class="history-total">合計：0円</div>

<button id="order-nav" class="order-nav" type="button">戻る</button>

<div class="bottom"></div>
<div class="home"></div>

</div>

<script>
const historyBody = document.getElementById("history-body");
const historyEmpty = document.getElementById("history-empty");
const historyTotal = document.getElementById("history-total");
let orderHistory = JSON.parse(localStorage.getItem("orderHistory") || "[]");

function updateEmptyMessage() {
  historyEmpty.style.display = orderHistory.length ? "none" : "block";
}

function renderHistory() {
  historyBody.innerHTML = "";
  updateEmptyMessage();
  let grandTotal = 0;

  orderHistory.forEach((item, index) => {
    const row = document.createElement("tr");
    const nameCell = document.createElement("td");
    const qtyCell = document.createElement("td");
    const priceCell = document.createElement("td");

    nameCell.textContent = item.name;
    qtyCell.textContent = item.qty;
    const unitPrice = Number(item.unitPrice ?? item.price);
    const totalPrice = unitPrice * Number(item.qty);
    grandTotal += totalPrice;
    priceCell.textContent = totalPrice.toLocaleString();

    row.append(nameCell, qtyCell, priceCell);
    historyBody.appendChild(row);
  });

  historyTotal.textContent = `合計：${grandTotal.toLocaleString()}円`;
}

renderHistory();
</script>
<script src="/js/order-history-db.js"></script>

</body>
</html>
