<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注文画面 Codex UI</title>

<link rel="stylesheet" href="/css/common.css">

<style>
:root {
  --forest: #12382a;
  --leaf: #2f7a4f;
  --moss: #eef6ed;
  --amber: #c97718;
  --ink: #20322b;
  --muted: #68756f;
  --line: #dbe5df;
  --surface: #ffffff;
  --shadow: 0 14px 34px rgba(18, 56, 42, 0.14);
}

body {
  margin: 0;
  min-height: 100vh;
  background: #f4f7f2;
  color: var(--ink);
  font-family: "Yu Gothic", "Hiragino Kaku Gothic ProN", Meiryo, sans-serif;
}

.phone {
  width: min(100%, 1180px);
  min-height: 100vh;
  height: auto;
  margin: 0 auto;
  background: #f8faf6;
  border: 0;
  border-radius: 0;
  position: relative;
  overflow: visible;
}

.header {
  background: var(--forest);
  color: #fff;
  text-align: left;
  font-size: 30px;
  font-weight: 800;
  padding: 24px clamp(18px, 4vw, 44px);
  border-radius: 0;
  letter-spacing: 0;
}

.header-sub {
  display: block;
  margin-top: 6px;
  color: rgba(255, 255, 255, 0.78);
  font-size: 13px;
  font-weight: 700;
}

.category-bar {
  position: sticky;
  top: 0;
  z-index: 4;
  display: flex;
  gap: 8px;
  padding: 12px clamp(12px, 3vw, 36px);
  overflow-x: auto;
  background: rgba(248, 250, 246, 0.96);
  border-bottom: 1px solid var(--line);
  backdrop-filter: blur(8px);
}

.tab {
  flex: 0 0 auto;
  min-height: 40px;
  padding: 0 15px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  box-shadow: 0 2px 8px rgba(18, 56, 42, 0.05);
}

.tab.active {
  border-color: var(--forest);
  background: var(--forest);
  color: #fff;
}

.info-bar {
  display: grid;
  grid-template-columns: 1fr auto;
  gap: 10px;
  padding: 14px clamp(14px, 3vw, 36px) 8px;
  font-size: 14px;
}

.info-bar span {
  min-height: 38px;
  display: inline-flex;
  align-items: center;
  padding: 0 14px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: 0 4px 14px rgba(18, 56, 42, 0.05);
}

.sold-out-toggle {
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}

.table-number {
  color: var(--forest);
  font-weight: 800;
}

.product-list {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 16px;
  padding: 14px clamp(14px, 3vw, 36px) 128px;
  box-sizing: border-box;
}

.card {
  display: grid;
  grid-template-rows: auto 1fr auto auto;
  min-height: 278px;
  padding: 10px;
  border: 1px solid var(--line);
  border-radius: 8px;
  background: var(--surface);
  box-shadow: var(--shadow);
}

.image {
  height: auto;
  aspect-ratio: 4 / 3;
  background: #d6ded8;
  border-radius: 8px;
  overflow: hidden;
}

.image img {
  width: 100% !important;
  height: 100% !important;
  object-fit: cover;
  border-radius: 8px !important;
}

.name {
  display: flex;
  align-items: center;
  min-height: 46px;
  margin-top: 10px;
  padding: 0;
  border-radius: 0;
  background: transparent;
  color: var(--ink);
  font-size: 16px;
  font-weight: 800;
}

.price {
  margin-top: 4px;
  color: var(--amber);
  font-size: 17px;
  font-weight: 900;
}

.order-btn {
  width: 100%;
  min-height: 44px;
  margin-top: 12px;
  padding: 0 18px;
  border: none;
  border-radius: 8px;
  background: var(--leaf);
  color: #fff;
  font-size: 15px;
  font-weight: 800;
  cursor: pointer;
}

.order-btn:hover,
.tab:hover,
.menu-btn:hover {
  filter: brightness(1.04);
}

.order-btn:active,
.qty-btn:active,
.modal-buttons button:active,
.complete-ok:active,
.menu-btn:active {
  transform: translateY(1px);
}

#cart-area {
  display: none;
}

#total-area,
.menu-bar {
  position: fixed;
  left: 50%;
  width: min(100%, 1180px);
  transform: translateX(-50%);
  box-sizing: border-box;
}

#total-area {
  bottom: 58px;
  z-index: 5;
  padding: 12px clamp(18px, 4vw, 44px);
  background: #fff;
  color: var(--forest);
  text-align: right;
  font-size: 18px;
  font-weight: 900;
  border-top: 1px solid var(--line);
}

.menu-bar {
  bottom: 0;
  z-index: 5;
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 8px clamp(10px, 3vw, 32px);
  background: var(--forest);
}

.menu-btn {
  min-height: 42px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  background: rgba(255, 255, 255, 0.12);
  color: #fff;
  font-weight: 800;
  cursor: pointer;
}

.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 20;
  justify-content: center;
  align-items: center;
  padding: 18px;
  background: rgba(18, 56, 42, 0.42);
}

.modal.active {
  display: flex;
}

.modal-box {
  width: min(94vw, 380px);
  min-height: auto;
  max-height: 92vh;
  overflow-y: auto;
  box-sizing: border-box;
  background: #fff;
  border: 0;
  border-radius: 8px;
  padding: 18px;
  text-align: center;
  box-shadow: 0 24px 70px rgba(0, 0, 0, 0.28);
}

.modal-title {
  height: auto;
  line-height: 1.4;
  border: 0;
  color: var(--forest);
  font-size: 20px;
  font-weight: 900;
}

.modal-image {
  width: min(100%, 240px);
  height: auto;
  aspect-ratio: 4 / 3;
  background: #d6ded8;
  border-radius: 8px;
  margin: 16px auto;
  overflow: hidden;
}

.modal-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.modal-name {
  min-height: 26px;
  color: var(--ink);
  font-size: 18px;
  font-weight: 900;
  margin-bottom: 14px;
}

.qty-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 12px;
  color: var(--muted);
  font-weight: 800;
}

.qty-control {
  display: flex;
  align-items: center;
  gap: 8px;
}

.qty-btn {
  width: 44px;
  height: 44px;
  border: none;
  border-radius: 8px;
  background: var(--forest);
  color: #fff;
  font-size: 25px;
  font-weight: 900;
  line-height: 1;
  cursor: pointer;
}

#qty {
  width: 62px;
  height: 44px;
  text-align: center;
  border: 1px solid var(--line);
  border-radius: 8px;
  box-sizing: border-box;
  color: var(--ink);
  font-size: 20px;
  font-weight: 900;
}

#qty::-webkit-outer-spin-button,
#qty::-webkit-inner-spin-button {
  margin: 0;
}

.modal-buttons {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
  margin-top: 22px;
}

.modal-buttons button,
.complete-ok {
  width: 100%;
  height: 46px;
  background: var(--forest);
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 900;
  cursor: pointer;
}

.modal-buttons button:first-child {
  background: #e9eee9;
  color: var(--ink);
}

.complete-text,
.payment-text,
.staff-call-text,
.history-text,
.staff-call-complete-text {
  min-height: 160px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 14px;
  color: var(--ink);
  font-size: 15px;
  font-weight: 800;
  line-height: 1.7;
}

.payment-total {
  color: var(--amber);
  font-size: 19px;
  font-weight: 900;
}

.complete-ok {
  max-width: 180px;
  margin-top: 18px;
}

.bottom,
.home {
  display: none;
}

@media (max-width: 520px) {
  .header {
    font-size: 26px;
    padding: 20px 18px;
  }

  .info-bar {
    grid-template-columns: 1fr;
  }

  .product-list {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
    padding-left: 10px;
    padding-right: 10px;
  }

  .card {
    min-height: 238px;
    padding: 8px;
  }

  .name {
    font-size: 14px;
    min-height: 40px;
  }

  .price {
    font-size: 15px;
  }
}
</style>
</head>

<script>

// ✅ タブ切り替え（フィルター）
document.querySelectorAll(".tab").forEach(tab => {
  tab.addEventListener("click", function() {

    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    this.classList.add("active");

    const filter = this.dataset.filter;

    document.querySelectorAll(".card").forEach(card => {
      if (filter === "all" || card.dataset.category === filter) {
        card.style.display = "block";
      } else {
        card.style.display = "none";
      }
    });
  });
});

// ✅ 注文モーダル
const modal = document.getElementById("modal");
const modalName = document.getElementById("modal-name");
const modalImg = document.getElementById("modal-img");
const qtyInput = document.getElementById("qty");
const completeModal = document.getElementById("complete-modal");
const completeImg = document.getElementById("complete-img");
const completeName = document.getElementById("complete-name");
const completeQty = document.getElementById("complete-qty");
const paymentModal = document.getElementById("payment-modal");
const paymentTotal = document.getElementById("payment-total");
const paymentCompleteModal = document.getElementById("payment-complete-modal");
const staffCallModal = document.getElementById("staff-call-modal");
const staffCallCompleteModal = document.getElementById("staff-call-complete-modal");
const historyModal = document.getElementById("history-modal");
const totalArea = document.getElementById("total-area");
const tableNumber = document.getElementById("table-number");
const qtyMinus = document.getElementById("qty-minus");
const qtyPlus = document.getElementById("qty-plus");
const DEFAULT_ORDER_QTY_MAX = 30;
const ORDER_QTY_PER_GUEST = 3;

function getCurrentOrderTable() {
  const tableFromUrl = new URLSearchParams(location.search).get("table");

  if (tableFromUrl) {
    localStorage.setItem("currentOrderTable", tableFromUrl);
    return tableFromUrl;
  }

  return localStorage.getItem("currentOrderTable");
}

function getOrderQtyMax() {
  const tableNo = getCurrentOrderTable();
  const guestCounts = JSON.parse(localStorage.getItem("tableGuestCounts") || "{}");
  const guestCount = parseInt(guestCounts[tableNo], 10);

  if (Number.isInteger(guestCount) && guestCount > 0) {
    return guestCount * ORDER_QTY_PER_GUEST;
  }

  return DEFAULT_ORDER_QTY_MAX;
}

let ORDER_QTY_MAX = getOrderQtyMax();
qtyInput.max = ORDER_QTY_MAX;
const currentOrderTable = getCurrentOrderTable();
tableNumber.textContent = currentOrderTable ? `卓番号：${currentOrderTable}` : "卓番号：未選択";
let currentCard;
let totalPrice = 0;
let orderHistory = JSON.parse(localStorage.getItem("orderHistory") || "[]");

function normalizeQty(value) {
  const qty = parseInt(value, 10);

  if (!Number.isInteger(qty) || qty < 1) {
    return 1;
  }

  return Math.min(qty, ORDER_QTY_MAX);
}

function changeQty(amount) {
  qtyInput.value = normalizeQty(normalizeQty(qtyInput.value) + amount);
}

document.querySelectorAll(".order-btn").forEach(btn => {
  btn.onclick = function() {
    const card = this.closest(".card");
    const name = card.querySelector(".name").innerText;
    const image = card.querySelector("img");

    currentCard = card;
    ORDER_QTY_MAX = getOrderQtyMax();
    qtyInput.max = ORDER_QTY_MAX;
    modalName.innerText = name;
    modalImg.src = image.src;
    modalImg.alt = name;
    qtyInput.value = 1;
    modal.classList.add("active");
  };
});

document.getElementById("no").onclick = () => modal.classList.remove("active");

qtyInput.addEventListener("input", () => {
  const qty = parseInt(qtyInput.value, 10);
  if (Number.isInteger(qty) && qty > ORDER_QTY_MAX) {
    qtyInput.value = ORDER_QTY_MAX;
  }
});

qtyInput.addEventListener("blur", () => {
  qtyInput.value = normalizeQty(qtyInput.value);
});

qtyMinus.onclick = () => changeQty(-1);
qtyPlus.onclick = () => changeQty(1);

document.getElementById("yes").onclick = () => {
  const qty = normalizeQty(qtyInput.value);
  qtyInput.value = qty;

  totalPrice += parseInt(currentCard.dataset.price, 10) * qty;
  totalArea.innerText = `合計：${totalPrice.toLocaleString()}円`;

  const itemName = modalName.innerText;
  const unitPrice = parseInt(currentCard.dataset.price, 10);
  const itemPrice = unitPrice * qty;
  const existingItem = orderHistory.find(item => {
    const existingUnitPrice = Number(item.unitPrice ?? item.price);
    return item.name === itemName && existingUnitPrice === unitPrice;
  });

  if (existingItem) {
    existingItem.unitPrice = unitPrice;
    existingItem.qty += qty;
    existingItem.price = unitPrice * existingItem.qty;
  } else {
    orderHistory.push({
      name: itemName,
      qty: qty,
      unitPrice: unitPrice,
      price: itemPrice
    });
  }

  localStorage.setItem("orderHistory", JSON.stringify(orderHistory));

  modal.classList.remove("active");
  completeName.innerText = modalName.innerText;
  completeQty.innerText = `個数：${qty}`;
  completeImg.src = modalImg.src;
  completeImg.alt = modalName.innerText;
  completeModal.classList.add("active");
};

document.getElementById("complete-ok").onclick = () => {
  completeModal.classList.remove("active");
};

// ✅ メニュー
document.getElementById("account").onclick = () => {
  paymentTotal.innerText = `会計：${totalPrice.toLocaleString()}円`;
  paymentModal.classList.add("active");
};

document.getElementById("payment-no").onclick = () => {
  paymentModal.classList.remove("active");
};

document.getElementById("payment-yes").onclick = () => {
  paymentModal.classList.remove("active");
