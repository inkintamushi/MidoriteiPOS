<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>対応状況 - みどり亭</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #dcdcdc;
  font-family: sans-serif;
}

/* ===== スマホ本体 → 実機画面いっぱいに表示 ===== */
.phone {
  width: 100%;
  min-height: 100vh;
  margin: 0;
  background: #fff;
  border-radius: 0;
  border: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: visible;
}

/* ===== ヘッダー（共通） ===== */
.header {
  background: #003d00;
  color: #fff;
  text-align: center;
  font-size: clamp(24px, 7vw, 36px);
  padding: clamp(18px, 5vw, 34px) 12px;
  border-radius: 0;
}

/* ===== タブ（共通） ===== */
.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 2px solid #999;
  border-bottom: 2px solid #999;
}
.tab {
  text-align: center;
  padding: 14px 0;
  background: #eee;
  border-right: 1px solid #999;
  font-size: 14px;
  cursor: pointer;
}
.tab:last-child { border-right: none; }
.tab.active-tab {
  background: #003d00;
  color: #fff;
  font-weight: bold;
}

/* ===== 下の黒いエリア・ホームボタン（実機では不要な演出のため非表示） ===== */
.bottom,
.home {
  display: none;
}

/* ===== 画面切替 ===== */
.screen { display: none; flex-direction: column; min-height: 0; flex: 1; }
.screen.active { display: flex; }

/* ===== コンテンツエリア ===== */
.content-area {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
}

/* ===================================================
   画面1：対応状況選択（プルダウン式）
=================================================== */
.status-modal-card {
  width: min(300px, 88vw);
  background: #fff;
  border: 3px solid #000;
  border-radius: 30px;
  margin: 60px auto 0;
  padding: 24px 22px;
  text-align: center;
}

.status-modal-title {
  border: 2px solid #000;
  padding: 12px 10px;
  font-size: 18px;
  margin-bottom: 20px;
  border-radius: 4px;
}

.status-modal-text {
  font-size: 14px;
  line-height: 1.7;
  color: #222;
  margin-bottom: 18px;
}

.status-select {
  width: 100%;
  height: 38px;
  font-size: 15px;
  padding: 4px 8px;
  border: 1px solid #999;
  border-radius: 4px;
  margin-bottom: 26px;
}

.status-modal-buttons {
  display: flex;
  justify-content: space-around;
}

.status-modal-buttons button {
  background: #003d00;
  color: #fff;
  border: none;
  padding: 11px 28px;
  border-radius: 15px;
  font-size: 15px;
  cursor: pointer;
}
.status-modal-buttons button:active { opacity: .75; }

/* ===================================================
   オーバーレイ（モーダル背景）
=================================================== */
.overlay {
  display: none;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.15);
  z-index: 20;
}
.overlay.active { display: block; }

/* ===== モーダルカード ===== */
.modal-card {
  width: min(300px, 88vw);
  background: #fff;
  border: 3px solid #000;
  border-radius: 30px;
  position: absolute;
  top: 46%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 28px 22px 32px;
  text-align: center;
}

.modal-title {
  border: 2px solid #000;
  padding: 14px 10px;
  font-size: 18px;
  margin-bottom: 60px;
  border-radius: 4px;
}

.modal-text {
  font-size: 15px;
  line-height: 2;
  color: #222;
  margin-bottom: 50px;
}

.ok-btn {
  display: block;
  margin: 0 auto;
  padding: 12px 50px;
  font-size: 18px;
  background: #003d00;
  color: #fff;
  border: none;
  border-radius: 15px;
  cursor: pointer;
}
.ok-btn:active { opacity: .75; }

/* ===================================================
   画面3：卓選択画面（taku.html準拠）
=================================================== */
#screen-table table {
  width: 100%;
  border-collapse: collapse;
  font-size: 14px;
}
#screen-table th,
#screen-table td {
  border: 1px solid #ccc;
  padding: 6px;
  text-align: center;
}
#screen-table th { background: #eee; }

/* 呼出・注文ボタン */
.btn {
  padding: 5px 10px;
  border: none;
  border-radius: 5px;
  color: #fff;
  cursor: pointer;
  font-size: 12px;
}
.btn:active { opacity: .75; }
.btn-green  { background: #1b5e20; }
.btn-orange { background: #ef6c00; }
.btn-light  { background: #8bc34a; }
.btn-gray   { background: #777; }

</style>
<link rel="stylesheet" href="/css/employee-auth.css">
<script src="/js/employee-auth.js"></script>
</head>

<body>
<div class="phone">

  <!-- ===== 共通ヘッダー（default_nav.html） ===== -->
  <div class="header">みどり亭</div>

  <!-- ===== 共通タブ（default_nav.html） ===== -->
  <div class="tabs">
    <div class="tab active-tab">ホーム</div>
    <div class="tab" onclick="location.href='mihaizen_rireki.html'">配膳登録</div>
    <div class="tab" onclick="location.href='kyakuannnai.html'">案内</div>
    <div class="tab" onclick="location.href='shouhinnkannri.html'">商品管理</div>
  </div>

  <!-- ============================================================
       画面1：対応状況選択画面（プルダウン式）
  ============================================================ -->
  <div id="screen-status" class="screen active">
    <div class="content-area">
      <div class="status-modal-card">
        <div class="status-modal-title">対応状況</div>
        <div class="status-modal-text">対応状況<br>を選択します。</div>
        <select id="status-select" class="status-select"></select>
        <div class="status-modal-buttons">
          <button type="button" onclick="location.href='taku.html'">戻る</button>
          <button type="button" onclick="confirmStatus()">確定</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ============================================================
       オーバーレイ：対応状態確定完了モーダル
  ============================================================ -->
  <div id="overlay-done" class="overlay">
    <div class="modal-card">
      <div class="modal-title">対応状態確定完了</div>
      <div class="modal-text">
        対応状態確定<br>を完了いたしました。
      </div>
      <button class="ok-btn" onclick="finishStatus()">ok</button>
    </div>
  </div>

  <!-- ===== 共通フッター（default_nav.html） ===== -->
  <div class="bottom"></div>
  <div class="home"></div>

</div>

<script>
/* ========================================
   卓ボタン動作（taku.html準拠）
======================================== */
function callTable(n)    { location.href = 'taioujoukyou.html'; }
function orderTable(n) {
  localStorage.setItem('currentOrderTable', n);
  location.href = 'tyuumonn.html?table=' + n;
}
function historyTable(n) { alert(n + '番卓 履歴'); }

/* ========================================
   画面切替
======================================== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ========================================
   状態遷移表(状態遷移表_v1.xlsx)に基づく、現在の座席状況ごとの
   有効なボタンと遷移先。'FINALIZE' は会計確定(finalize-payment)を意味する。
======================================== */
const TRANSITIONS = {
  CLEANING_UNHANDLED:   { '清掃中': 'CLEANING_IN_PROGRESS', '清掃応援': 'CLEANING_NEEDS_HELP', '清掃完了': 'AVAILABLE', '使用中止': 'OUT_OF_SERVICE' },
  CALL_UNHANDLED:       { '対応中': 'CALL_IN_PROGRESS', '要応援': 'CALL_NEEDS_HELP', '対応完了': 'OCCUPIED', '使用中止': 'OUT_OF_SERVICE' },
  CLEANING_NEEDS_HELP:  { '清掃中': 'CLEANING_IN_PROGRESS', '清掃完了': 'AVAILABLE', '使用中止': 'OUT_OF_SERVICE' },
  CALL_NEEDS_HELP:      { '対応中': 'CALL_IN_PROGRESS', '対応完了': 'OCCUPIED', '使用中止': 'OUT_OF_SERVICE' },
  CLEANING_IN_PROGRESS: { '清掃応援': 'CLEANING_NEEDS_HELP', '清掃完了': 'AVAILABLE', '使用中止': 'OUT_OF_SERVICE' },
  CALL_IN_PROGRESS:     { '要応援': 'CALL_NEEDS_HELP', '対応完了': 'OCCUPIED', '使用中止': 'OUT_OF_SERVICE' },
  AVAILABLE:            { '使用中止': 'OUT_OF_SERVICE' },
  OUT_OF_SERVICE:       { '対応完了': 'AVAILABLE', '清掃完了': 'AVAILABLE' },
  // 使用中: 利用客側のシステムを介さず対応する場合の直接会計(会計対応)を含む
  OCCUPIED:             { '対応中': 'CALL_IN_PROGRESS', '会計対応': 'FINALIZE', '使用中止': 'OUT_OF_SERVICE' },
  PAYMENT_WAITING:      { '対応中': 'FINALIZE' },
};

let currentTableStatus = null;

async function confirmStatus() {
  const select = document.getElementById('status-select');
  if (!select.value) return;

  const params = new URLSearchParams(location.search);
  const tableNo = params.get('table');
  const target = (TRANSITIONS[currentTableStatus] || {})[select.value];
  if (tableNo && target) {
    if (target === 'FINALIZE') {
      await fetch('/api/staff/tables/' + tableNo + '/finalize-payment', { method: 'PUT' });
    } else {
      await fetch('/api/staff/tables/' + tableNo, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ status: target })
      });
    }
  }
  document.getElementById('overlay-done').classList.add('active');
}

/* 現在の座席状況から選択可能な項目だけをプルダウンに表示する
   (状態遷移表: 状態遷移表_v1.xlsx) */
function renderStatusOptions() {
  const select = document.getElementById('status-select');
  select.innerHTML = '';
  const allowed = TRANSITIONS[currentTableStatus] || {};
  Object.keys(allowed).forEach(label => {
    const option = document.createElement('option');
    option.value = label;
    option.textContent = label;
    select.appendChild(option);
  });
}

function finishStatus() {
  document.getElementById('overlay-done').classList.remove('active');
  window.location.href = 'taku.html';
}

/* ========================================
   現在の卓状態を取得し、選択可能な項目を絞り込む
======================================== */
async function loadCurrentTableStatus() {
  const params = new URLSearchParams(location.search);
  const tableNo = params.get('table');
  if (!tableNo) return;
  const response = await fetch('/api/staff/tables');
  if (!response.ok) return;
  const tables = await response.json();
  const match = tables.find(t => String(t.table_number) === String(tableNo));
  currentTableStatus = match ? match.status : null;
  renderStatusOptions();
}
loadCurrentTableStatus();

/* ========================================
   初期描画
======================================== */
</script>
<script src="/js/table-management-db.js"></script>

</body>
</html>
