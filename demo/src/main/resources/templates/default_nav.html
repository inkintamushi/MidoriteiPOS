<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>nav入りデフォルト画面</title>

<style>
body {
  margin: 0;
  background: #dcdcdc;
  font-family: sans-serif;
}

/* スマホ本体 */
.phone {
  width: 380px;
  height: 820px;
  margin: 40px auto;
  background: #fff;
  border-radius: 50px;
  border: 5px solid #000;
  position: relative;
  overflow: hidden;
}

/* ヘッダー */
.header {
  background: #003d00;
  color: #fff;
  text-align: center;
  font-size: 36px;
  padding: 40px 0;
  border-top-left-radius: 20px;
  border-top-right-radius: 20px;
}

/* ===== 追加ここから ===== */

/* タブ */
.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 2px solid #999;
  border-bottom: 2px solid #999;
}

.tab {
  text-align: center;
  padding: 14px 0;
  background: #eee;
  border-right: 1px solid #999;
  font-size: 14px;
}

.tab:last-child {
  border-right: none;
}


/* ===== 追加ここまで ===== */

/* 下の黒いエリア */
.bottom {
  position: absolute;
  bottom: 0;
  width: 100%;
  height: 120px;
  background: #000;
}

/* ホームボタン */
.home {
  position: absolute;
  bottom: 35px;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 60px;
  border: 4px solid #fff;
  border-radius: 50%;
}
</style>

</head>
<body>

<div class="phone">

  <div class="header">みどり亭</div>

  <!-- タブ -->
  <div class="tabs">
    <div class="tab">卓選択</div>
    <div class="tab">未配膳</div>
    <div class="tab">案内</div>
    <div class="tab">商品管理</div>
  </div>

  <div class="bottom"></div>
  <div class="home"></div>

</div>

</body>
</html>
``
