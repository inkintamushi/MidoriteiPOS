<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>注文画面</title>

<link rel="stylesheet" href="/css/common.css">

<style>
.category-bar {
  display: flex;
  flex-wrap: nowrap;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  gap: 8px;
  background: #c96a00;
  padding: 10px;
}

.tab {
  background: #eee;
  border: none;
  padding: 6px 12px;
  border-radius: 20px;
  font-size: 12px;
  cursor: pointer;
  flex-shrink: 0;
  white-space: nowrap;
}

.tab.active {
  background: #003d00;
  color: #fff;
}

.info-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px;
  font-size: 14px;
}

.sold-out-toggle {
  display: flex;
  align-items: center;
  gap: 4px;
  cursor: pointer;
}

.table-number,
.remaining-time {
  color: #003d00;
  font-weight: bold;
}

.product-list {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 15px;
  padding: 10px 10px 26px;
  height: 350px;
  box-sizing: border-box;
  overflow-y: auto; /* 縦スクロールを有効化 */
  border: 1px solid #ccc; /* スクロール領域を視覚的に分けるための枠線（任意） */
}

.card {
  text-align: center;
}

.image {
  height: auto;
  aspect-ratio: 4 / 3;
  background: #999;
  border-radius: 15px;
}

.order-btn {
  margin-top: 10px;
  padding: 8px 20px;
  background: #003d00;
  color: #fff;
  border: none;
  border-radius: 10px;
  cursor: pointer;
}

.name {
  margin-top: 5px;
  background: #003d00;
  color: #fff;
  border-radius: 15px;
  font-size: 12px;
  padding: 5px;
}

.price {
  margin-top: 5px;
  color: #333;
  font-size: 13px;
  font-weight: bold;
}

.menu-bar {
  position: absolute;
  bottom: 120px;
  width: 100%;
  background: #90c978;
  display: flex;
  justify-content: space-around;
  padding: 10px 0;
}

.menu-btn {
  cursor: pointer;
}

#total-area {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 168px;
  z-index: 2;
  padding: 10px 0;
  background: #fff;
  color: #003d00;
  text-align: center;
  font-weight: bold;
  border-top: 1px solid #d8d8d8;
  border-bottom: 1px solid #d8d8d8;
}

/* モーダル */
.modal {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 10;
  background: rgba(255,255,255,0.2);
  justify-content: center;
  align-items: center;
  padding: 18px;
  box-sizing: border-box;
}

.modal.active {
  display: flex;
}

.modal-box {
  width: 300px;
  min-height: 500px;
  max-height: 90vh;
  overflow-y: auto;
  box-sizing: border-box;
  background: #fff;
  border: 4px solid #777;
  border-radius: 34px;
  padding: 24px 24px 18px;
  text-align: center;
  box-shadow: 0 2px 8px rgba(0,0,0,0.25);
}

.modal-title {
  height: 58px;
  line-height: 58px;
  border: 3px solid #8a8a8a;
  color: #555;
  font-size: 18px;
  font-weight: bold;
  box-sizing: border-box;
}

.modal-image {
  width: 160px;
  height: 160px;
  background: #888;
  border-radius: 20px;
  margin: 16px auto 28px;
  overflow: hidden;
}

.modal-image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.modal-name {
  min-height: 24px;
  color: #555;
  font-weight: bold;
  margin-bottom: 10px;
}

.plan-select-row {
  display: none;
  align-items: center;
  justify-content: center;
  gap: 8px;
  margin-bottom: 12px;
  color: #555;
  font-weight: bold;
}

#plan-select {
  min-width: 170px;
  height: 38px;
  border: 2px solid #d0d0d0;
  border-radius: 8px;
  background: #fff;
  color: #333;
  font-weight: bold;
  padding: 0 8px;
}

.qty-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #555;
  font-weight: bold;
}

.qty-control {
  display: flex;
  align-items: center;
  gap: 8px;
}

.qty-btn {
  width: 38px;
  height: 38px;
  border: none;
  border-radius: 50%;
  background: #003d00;
  color: #fff;
  font-size: 24px;
  font-weight: bold;
  line-height: 1;
  cursor: pointer;
}

#qty {
  width: 52px;
  height: 38px;
  text-align: center;
  border: 2px solid #d0d0d0;
  border-radius: 8px;
  box-sizing: border-box;
  font-size: 18px;
  font-weight: bold;
}

#qty::-webkit-outer-spin-button,
#qty::-webkit-inner-spin-button {
  margin: 0;
}

.modal-buttons {
  display: flex;
  justify-content: space-between;
  margin-top: 88px;
}

.modal-buttons button {
  width: 92px;
  height: 38px;
  background: #003d00;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.complete-text {
  color: #555;
  font-size: 13px;
  font-weight: bold;
  line-height: 1.7;
}

.complete-ok {
  width: 120px;
  height: 40px;
  margin-top: 34px;
  background: #003d00;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

.payment-text {
  min-height: 240px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  color: #555;
  font-size: 14px;
  font-weight: bold;
  line-height: 1.7;
}

.payment-total {
  font-size: 15px;
}

.staff-call-text,
.history-text {
  min-height: 220px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #555;
  font-size: 13px;
  font-weight: bold;
}

.staff-call-complete-text {
  min-height: 250px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 18px;
  color: #555;
  font-size: 13px;
  font-weight: bold;
}

.staff-call-buttons,
.history-buttons {
  margin-top: 80px;
}

/* Responsive Web layout: remove smartphone mock frame */
body {
  background: #fff;
  min-height: 100vh;
}

.phone {
  width: 100%;
  max-width: none;
  min-height: 100vh;
  height: auto;
  margin: 0;
  border: 0;
  border-radius: 0;
  overflow: visible;
  padding-bottom: calc(116px + env(safe-area-inset-bottom));
}

.header {
  border-radius: 0;
  padding: clamp(18px, 5vw, 34px) 12px;
  font-size: clamp(24px, 7vw, 36px);
}

.bottom,
.home {
  display: none;
}

.content,
.content-area {
  height: auto;
  min-height: calc(100vh - 140px);
  padding-bottom: 24px;
  overflow: visible;
}

@media (max-width: 640px) {
  .tabs,
  .category-bar,
  .menu-bar {
    overflow-x: auto;
  }
}

.product-list {
  grid-template-columns: repeat(2, minmax(0, 1fr));
  height: auto;
  min-height: 0;
  overflow: visible;
  padding-bottom: 64px;
}

#total-area {
  position: fixed;
  left: 0;
  right: 0;
  bottom: calc(60px + env(safe-area-inset-bottom));
  width: 100%;
  z-index: 6;
  box-sizing: border-box;
}

.menu-bar {
  position: fixed;
  left: 0;
  right: 0;
  bottom: 0;
  width: 100%;
  z-index: 5;
  padding-bottom: calc(10px + env(safe-area-inset-bottom));
}
</style>
</head>

<body>

<div class="phone">

<div class="header">みどり亭</div>

<div class="category-bar">
  <button class="tab active" data-filter="all">すべて</button>
  <button class="tab" data-filter="yaki">焼き鳥</button>
  <button class="tab" data-filter="alcohol">アルコール</button>
  <button class="tab" data-filter="softdrink">ソフトドリンク</button>
  <button class="tab" data-filter="dessert">デザート</button>
  <button class="tab" data-filter="tsukemono">漬物</button>
  <button class="tab" data-filter="ippin">一品</button>
  <button class="tab" data-filter="moriawase">盛り合わせ</button>
</div>

<div class="info-bar">
  <span id="table-number" class="table-number">卓番号：未選択</span>
  <label class="sold-out-toggle"><input type="checkbox" id="hide-sold-out" checked>品切れを表示しない</label>
  <span id="remaining-time" class="remaining-time" style="display:none;"></span>
</div>

<div class="product-list">

  <div class="card" data-category="yaki" data-price="180">
    <div class="image">
      <img src="/images/menu-01-tsukune.png" style="width:100%;height:100%;object-fit:cover;border-radius:15px;">
    </div>
    <div class="name">つくね</div>
    <div class="price">180円</div>
    <button class="order-btn">注文</button>
  </div>

  <div class="card" data-category="alcohol" data-price="550">
    <div class="image">
      <img src="/images/menu-02-sake.png" style="width:100%;height:100%;object-fit:cover;border-radius:15px;">
    </div>
    <div class="name">日本酒</div>
    <div class="price">550円</div>
    <button class="order-btn">注文</button>
  </div>

  <div class="card" data-category="softdrink" data-price="320">
    <div class="image">
      <img src="/images/menu-03-water.png" style="width:100%;height:100%;object-fit:cover;border-radius:15px;">
    </div>
    <div class="name">水</div>
    <div class="price">320円</div>
    <button class="order-btn">注文</button>
  </div>

  <div class="card" data-category="yaki" data-price="450">
    <div class="image">
      <img src="/images/menu-04-inari.png" style="width:100%;height:100%;object-fit:cover;border-radius:15px;">
    </div>
    <div class="name">いなり</div>
    <div class="price">450円</div>
    <button class="order-btn">注文</button>
  </div>

  <div class="card" data-category="alcohol" data-price="810">
    <div class="image">
      <img src="/images/menu-05-beer.png" style="width:100%;height:100%;object-fit:cover;border-radius:15px;">
    </div>
    <div class="name">ビール</div>
    <div class="price">810円</div>
    <button class="order-btn">注文</button>
  </div>

  <div class="card" data-category="yaki" data-price="160">
    <div class="image">
        <img src="/images/menu-07-torikawa.png" style="width:100%;height:100%;object-fit:cover;border-radius:15px;">
    </div>
    <div class="name">くにくにの鶏皮</div>
    <div class="price">160円</div>
    <button class="order-btn">注文</button>
  </div>

</div>

<!-- カート -->
<div id="cart-area"></div>

<div class="menu-bar">
  <span class="menu-btn" id="account">会計</span>
  <span class="menu-btn" id="call">店員呼出</span>
  <span class="menu-btn" id="history">履歴</span>
</div>

<div class="bottom"></div>
<div class="home"></div>

<!-- モーダル -->
<div id="modal" class="modal">
  <div class="modal-box">
    <div class="modal-title">注文</div>

    <div class="modal-image">
      <img id="modal-img" alt="">
    </div>

    <div id="modal-name" class="modal-name"></div>

    <label id="plan-select-row" class="plan-select-row">
      <span>プラン:</span>
      <select id="plan-select"></select>
    </label>

    <label class="qty-row">
      <span id="qty-label">個数:</span>
      <span class="qty-control">
        <button id="qty-minus" class="qty-btn" type="button" aria-label="個数を減らす">−</button>
        <input id="qty" type="number" value="1" min="1" max="30">
        <button id="qty-plus" class="qty-btn" type="button" aria-label="個数を増やす">＋</button>
      </span>
    </label>

    <div class="modal-buttons">
      <button id="no" type="button">No</button>
      <button id="yes" type="button">Yes</button>
    </div>
  </div>
</div>

<!-- 注文完了モーダル -->
<div id="complete-modal" class="modal">
  <div class="modal-box">
    <div class="modal-title">注文</div>

    <div class="modal-image">
      <img id="complete-img" alt="">
    </div>

    <div class="complete-text">
      <div id="complete-name"></div>
      <div id="complete-qty"></div>
      <div>注文<br>を完了いたしました。</div>
    </div>

    <button id="complete-ok" class="complete-ok" type="button">ok</button>
  </div>
</div>

<!-- 会計確認モーダル -->
<div id="payment-modal" class="modal">
  <div class="modal-box">
    <div class="modal-title">会計</div>

    <div class="payment-text">
      <div id="payment-total" class="payment-total">会計：0円</div>
      <div>お会計してもよろしいでしょうか。</div>
    </div>

    <div class="modal-buttons">
      <button id="payment-no" type="button">No</button>
      <button id="payment-yes" type="button">Yes</button>
    </div>
  </div>
</div>

<!-- 精算待機モーダル -->
<div id="payment-complete-modal" class="modal">
  <div class="modal-box">
    <div class="modal-title">会計</div>

    <div class="payment-text">
      <div>会計をいたします。</div>
      <div>そのまま卓にてお待ちください。</div>
    </div>

  </div>
</div>

<!-- 店員呼出確認モーダル -->
<div id="staff-call-modal" class="modal">
  <div class="modal-box">
    <div class="modal-title">店員呼出</div>

    <div class="staff-call-text">店員呼出いたします。</div>

    <div class="modal-buttons staff-call-buttons">
      <button id="staff-call-no" type="button">No</button>
      <button id="staff-call-yes" type="button">Yes</button>
    </div>
  </div>
</div>

<!-- 店員呼出待機モーダル -->
<div id="staff-call-complete-modal" class="modal">
  <div class="modal-box">
    <div class="modal-title">店員呼出</div>

    <div class="staff-call-complete-text">
      <div>店員呼出中です。</div>
      <div>少々、お待ちください。</div>
    </div>

    <button id="staff-call-ok" class="complete-ok" type="button">ok</button>
  </div>
</div>

<!-- 履歴確認モーダル -->
<div id="history-modal" class="modal">
  <div class="modal-box">
    <div class="modal-title">履歴</div>

    <div class="history-text">注文履歴画面へ移動しますか。</div>

    <div class="modal-buttons history-buttons">
      <button id="history-no" type="button">No</button>
      <button id="history-yes" type="button">Yes</button>
    </div>
  </div>
</div>

</div>

<script src="/js/customer-order-db.js"></script>

</body>
</html>
