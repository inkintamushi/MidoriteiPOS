<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>注文画面 - みどり亭</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: #dcdcdc;
  font-family: sans-serif;
}

/* ===== スマホ本体 → 実機画面いっぱいに表示 ===== */
.phone {
  width: 100%;
  min-height: 100vh;
  margin: 0;
  background: #fff;
  border-radius: 0;
  border: 0;
  position: relative;
  display: flex;
  flex-direction: column;
  overflow: visible;
}

/* ===== ヘッダー（共通） ===== */
.header {
  background: #003d00;
  color: #fff;
  text-align: center;
  font-size: clamp(24px, 7vw, 36px);
  padding: clamp(18px, 5vw, 34px) 12px;
  border-radius: 0;
}

/* ===== タブ（共通） ===== */
.tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  border-top: 2px solid #999;
  border-bottom: 2px solid #999;
}
.tab {
  text-align: center;
  padding: 14px 0;
  background: #eee;
  border-right: 1px solid #999;
  font-size: 14px;
}
.tab:last-child { border-right: none; }

/* ===== 下の黒いエリア・ホームボタン（実機では不要な演出のため非表示） ===== */
.bottom,
.home {
  display: none;
}

/* ===== 画面切替 ===== */
.screen { display: none; flex-direction: column; min-height: 0; flex: 1; }
.screen.active { display: flex; }

/* ===== コンテンツエリア ===== */
.content-area {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
}

/* ===== グリッド ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 20px 12px;
  padding: 22px 22px 10px;
}

/* ===== カテゴリ・商品ボタン ===== */
.btn {
  height: 85px;
  background: #003d00;
  color: #fff;
  border: none;
  border-radius: 18px;
  font-size: 13px;
  line-height: 1.5;
  cursor: pointer;
  padding: 6px;
}
.btn:active { opacity: .75; }

/* ===== QR再発行 / 戻る ボタン ===== */
.action-btn {
  display: block;
  margin: 16px auto 10px;
  padding: 13px 36px;
  font-size: 18px;
  background: #003d00;
  color: #fff;
  border: none;
  border-radius: 14px;
  cursor: pointer;
}
.action-btn:active { opacity: .75; }

/* ===== オーバーレイ ===== */
.overlay {
  display: none;
  position: absolute;
  top: 0; left: 0;
  width: 100%; height: 100%;
  background: rgba(0,0,0,0.2);
  z-index: 20;
}
.overlay.active { display: block; }

/* ===== モーダルカード共通 ===== */
.modal-card {
  width: min(300px, 88vw);
  background: #fff;
  border: 3px solid #000;
  border-radius: 40px;
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  padding: 26px 20px;
  text-align: center;
}

/* ===== タイトル枠 ===== */
.modal-title {
  border: 2px solid #000;
  padding: 13px 10px;
  font-size: 19px;
  margin-bottom: 26px;
  border-radius: 4px;
}

/* ===== モーダル本文 ===== */
.modal-body {
  font-size: 15px;
  line-height: 2.3;
  text-align: left;
  padding: 0 10px;
}
.modal-body p { text-align: center; }

/* 個数入力 */
.qty-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 10px;
}
.qty-input {
  width: 60px;
  height: 32px;
  border: 1px solid #999;
  text-align: center;
  font-size: 15px;
}

/* ===== No / Yes ボタン ===== */
.modal-buttons {
  display: flex;
  justify-content: space-around;
  margin-top: 32px;
}
.modal-btn {
  background: #003d00;
  color: #fff;
  border: none;
  padding: 11px 32px;
  border-radius: 15px;
  font-size: 15px;
  cursor: pointer;
}
.modal-btn:active { opacity: .75; }

/* ===== 完了モーダル追加スタイル ===== */
.done-sub {
  margin-top: 14px;
  line-height: 2;
  font-size: 15px;
  text-align: center;
}

/* ===== ok ボタン ===== */
.ok-btn {
  display: block;
  margin: 28px auto 0;
  padding: 11px 44px;
  font-size: 18px;
  background: #003d00;
  color: #fff;
  border: none;
  border-radius: 15px;
  cursor: pointer;
}
.ok-btn:active { opacity: .75; }

/* ===== QRコード再表示モーダル ===== */
.qr-overlay-inner {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
}
.qr-card {
  width: min(310px, 88vw);
  border: 2px solid #000;
  border-radius: 16px;
  padding: 18px 16px;
  background: #fff;
}
.qr-id-row {
  font-size: 13px;
  margin-bottom: 12px;
  letter-spacing: 1px;
}
.qr-box {
  width: 200px;
  height: 160px;
  background: #888;
  color: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 15px;
  border-radius: 6px;
  margin: 0 auto 12px;
}
.barcode-btn {
  display: block;
  width: 200px;
  margin: 0 auto 16px;
  padding: 9px 0;
  background: #888;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 13px;
  cursor: pointer;
}
.print-row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  margin-top: 4px;
}
.print-row input {
  width: 50px;
  height: 32px;
  border: 1px solid #999;
  text-align: center;
  font-size: 14px;
}
.print-btn {
  padding: 7px 28px;
  background: #003d00;
  color: #fff;
  border: none;
  border-radius: 8px;
  font-size: 14px;
  cursor: pointer;
}

</style>
<link rel="stylesheet" href="/css/employee-auth.css">
<script src="/js/employee-auth.js"></script>
</head>

<body>
<div class="phone">

  <!-- ===== 共通ヘッダー（default_nav.html） ===== -->
  <div class="header">みどり亭</div>

  <!-- ===== 共通タブ（default_nav.html） ===== -->
  <div class="tabs">
    <div class="tab" onclick="location.href='taku.html'">ホーム</div>
    <div class="tab" onclick="location.href='mihaizen_rireki.html'">配膳登録</div>
    <div class="tab" onclick="location.href='kyakuannnai.html'">案内</div>
    <div class="tab" onclick="location.href='shouhinnkannri.html'">商品管理</div>
  </div>

  <!-- ============================================================
       画面1: 注文画面（カテゴリ一覧）
  ============================================================ -->
  <div id="screen-main" class="screen active">
    <div class="content-area">
      <div class="grid" id="category-grid"></div>
      <button class="action-btn" onclick="location.href='taku.html'">戻る</button>
    </div>
  </div>

  <!-- ============================================================
       画面2: 注文画面_商品一覧
  ============================================================ -->
  <div id="screen-yaki" class="screen">
    <div class="content-area">
      <div class="grid" id="product-grid"></div>
      <button class="action-btn" onclick="showScreen('screen-main')">戻る</button>
    </div>
  </div>

  <!-- ============================================================
       オーバーレイ1: 注文確定モーダル
  ============================================================ -->
  <div id="overlay-confirm" class="overlay">
    <div class="modal-card">
      <div class="modal-title">注文確定</div>
      <div class="modal-body">
        <p id="confirm-table">卓番号：</p>
        <p id="confirm-item">商品名：</p>
        <div class="qty-row">
          <span>個数：</span>
          <input type="number" id="qty-input" class="qty-input" value="1" min="1">
        </div>
      </div>
      <div class="modal-buttons">
        <button class="modal-btn" onclick="closeConfirm()">No</button>
        <button class="modal-btn" onclick="executOrder()">Yes</button>
      </div>
    </div>
  </div>

  <!-- ============================================================
       オーバーレイ2: 注文完了モーダル
  ============================================================ -->
  <div id="overlay-done" class="overlay">
    <div class="modal-card">
      <div class="modal-title">注文完了</div>
      <div class="modal-body">
        <p id="done-table">卓番号：</p>
        <p id="done-item"></p>
        <p id="done-qty"></p>
      </div>
      <div class="done-sub">
        注文<br>を完了いたしました。
      </div>
      <button class="ok-btn" onclick="finishOrder()">ok</button>
    </div>
  </div>

  <!-- ============================================================
       オーバーレイ3: QRコード再表示モーダル
  ============================================================ -->
  <div id="qr-modal" class="overlay">
    <div class="qr-overlay-inner">
      <div class="qr-card">
        <div class="qr-id-row" id="qr-modal-text">卓番号：</div>
        <div class="qr-box" id="qr-code-box">QRコード表示</div>
        <div class="print-row">
          <span>印刷数：</span>
          <input id="qr-print-count" type="number" value="1" min="1">
          <button class="print-btn" onclick="closeQR()">閉じる</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ===== 共通フッター（default_nav.html） ===== -->
  <div class="bottom"></div>
  <div class="home"></div>

</div>

<script>
/* ========================================
   画面切替
======================================== */
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function showOverlay(id) {
  document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function closeAllOverlays() {
  document.querySelectorAll('.overlay').forEach(o => o.classList.remove('active'));
}

/* ========================================
   QRコード再表示（table-management-db.js が実装を上書きする）
======================================== */
function reissueQr(tableNo) {
  showOverlay('qr-modal');
}

function closeQR() {
  closeAllOverlays();
}
</script>
<script src="/js/tyuumonn-db.js"></script>
<script src="/js/table-management-db.js"></script>

</body>
</html>
